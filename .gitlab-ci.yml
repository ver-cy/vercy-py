stages: [test, build, publish]

test:
  stage: test
  image: python:${PY}-slim
  parallel:
    matrix:
      - PY: ["3.9", "3.10", "3.11", "3.12", "3.13"]
  script:
    - python -m unittest discover -s tests -v

test-windows:
  stage: test
  tags: [saas-windows-medium-amd64]
  allow_failure: true          # shared Windows runners are beta and sometimes queue for long
  script:
    - choco install python312 -y --no-progress
    - $env:PATH = "C:\Python312;C:\Python312\Scripts;" + $env:PATH
    - python -m unittest discover -s tests -v

build:
  stage: build
  image: python:3.12-slim
  needs: [test]                # do not wait for the slow Windows runner
  script:
    - pip install --quiet build
    - python -m build
    - pip install dist/*.whl
    - vercy check tests/fixtures/fixture-overlay.jsonl --quiet
    - cd /tmp && printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | vercy mcp | grep -q check_record
  artifacts:
    paths: [dist/]
    expire_in: 30 days

# Publishing to PyPI makes the source public. Runs only on a v* tag, only when
# started by hand, and only after the owner has configured a PyPI trusted
# publisher for this project (no token is stored here).
publish-pypi:
  stage: publish
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
      when: manual
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install --quiet twine id
    - python -c "import json,os,urllib.request as u; r=u.urlopen(u.Request('https://pypi.org/_/oidc/mint-token', data=json.dumps({'token':os.environ['PYPI_ID_TOKEN']}).encode())); print('TWINE_PASSWORD=' + json.load(r)['token'])" > .pypi.env
    - export TWINE_USERNAME=__token__ && export $(cat .pypi.env) && rm .pypi.env
    - twine upload dist/*
